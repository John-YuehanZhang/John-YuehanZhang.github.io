---
permalink: /plan/
title: "我的计划"
layout: plan
sitemap: false
---

<div id="plan-app" data-vault="{{ '/assets/plan/vault.json' | relative_url }}">

  <form id="pq-lock" class="pq-lock" autocomplete="off">
    <label for="pq-password">请输入密码</label>
    <div class="pq-lock__row">
      <input id="pq-password" type="password" autocomplete="current-password" required>
      <button type="submit" id="pq-unlock">进入</button>
    </div>
    <label class="pq-remember"><input type="checkbox" id="pq-remember" checked> 在这台设备上 24 小时内不用再输密码</label>
    <p id="pq-lock-msg" class="pq-msg" role="status"></p>
    <p id="pq-first-run" class="pq-msg" hidden>还没有设置密码：<a href="{{ '/plan/setup/' | relative_url }}">去设置</a></p>
  </form>

  <div id="pq-board" class="pq-board" hidden>
    <div class="pq-toolbar">
      <span id="pq-status" class="pq-status" role="status"></span>
      <button type="button" id="pq-lock-btn" class="pq-btn-plain">锁定</button>
    </div>

    <div id="pq-conflict" class="pq-conflict" hidden>
      <p>这份计划在其他设备上被修改过，本机的改动还没保存。</p>
      <button type="button" id="pq-take-remote">载入最新版本（放弃本机改动）</button>
      <button type="button" id="pq-keep-local">用本机版本覆盖</button>
    </div>

    <div class="pq-grid">
      <section class="pq-quad pq-q1" data-q="1">
        <header><h2>重要且紧急</h2><span class="pq-hint">马上做</span></header>
        <ul class="pq-list"></ul>
        <form class="pq-add"><input type="text" placeholder="添加一项…" maxlength="500"><button type="submit">添加</button></form>
      </section>
      <section class="pq-quad pq-q2" data-q="2">
        <header><h2>重要但不紧急</h2><span class="pq-hint">计划做</span></header>
        <ul class="pq-list"></ul>
        <form class="pq-add"><input type="text" placeholder="添加一项…" maxlength="500"><button type="submit">添加</button></form>
      </section>
      <section class="pq-quad pq-q3" data-q="3">
        <header><h2>紧急但不重要</h2><span class="pq-hint">交给别人或快速处理</span></header>
        <ul class="pq-list"></ul>
        <form class="pq-add"><input type="text" placeholder="添加一项…" maxlength="500"><button type="submit">添加</button></form>
      </section>
      <section class="pq-quad pq-q4" data-q="4">
        <header><h2>不紧急也不重要</h2><span class="pq-hint">少做或不做</span></header>
        <ul class="pq-list"></ul>
        <form class="pq-add"><input type="text" placeholder="添加一项…" maxlength="500"><button type="submit">添加</button></form>
      </section>
    </div>

    <section class="pq-timeline" aria-label="时间轴">
      <header><h2>时间轴</h2><span class="pq-hint">在象限里的任务上点右键，或用“移到…”里的“加入时间轴…”，也能加进来</span></header>
      <ol id="pq-tl-list" class="pq-tl-list"></ol>
      <form id="pq-tl-add" class="pq-tl-add">
        <input type="text" id="pq-tl-text" placeholder="DDL 名称" maxlength="500" required>
        <input type="date" id="pq-tl-date" required aria-label="日期">
        <input type="time" id="pq-tl-time" aria-label="时间（可不填）">
        <button type="submit">添加</button>
      </form>
    </section>
  </div>

  <div id="pq-menu" class="pq-menu" role="menu" hidden>
    <button type="button" role="menuitem" id="pq-menu-tl">添加到时间轴…</button>
  </div>

  <div id="pq-dialog" class="pq-dialog" hidden>
    <form id="pq-dialog-form" class="pq-dialog__box" role="dialog" aria-modal="true" aria-labelledby="pq-dialog-title">
      <h3 id="pq-dialog-title">添加到时间轴</h3>
      <label for="pq-dl-text">名称</label>
      <input type="text" id="pq-dl-text" maxlength="500" required>
      <div class="pq-dialog__row">
        <div><label for="pq-dl-date">日期</label><input type="date" id="pq-dl-date" required></div>
        <div><label for="pq-dl-time">时间（可不填）</label><input type="time" id="pq-dl-time"></div>
      </div>
      <div class="pq-dialog__actions">
        <button type="button" id="pq-dl-delete" class="pq-btn-danger" hidden>删除</button>
        <span class="pq-spacer"></span>
        <button type="button" id="pq-dl-cancel">取消</button>
        <button type="submit" id="pq-dl-ok">确定</button>
      </div>
    </form>
  </div>

  <noscript><p>这个页面需要启用 JavaScript。</p></noscript>
</div>

<script src="{{ '/assets/plan/plan-crypto.js' | relative_url }}"></script>
<script src="{{ '/assets/plan/plan-github.js' | relative_url }}"></script>
<script src="{{ '/assets/plan/plan-remember.js' | relative_url }}"></script>
<script src="{{ '/assets/plan/plan.js' | relative_url }}"></script>
